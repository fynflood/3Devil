[package]
name = "threedevil"
version = "0.1.2"
description = "Track large multi-part 3D print builds"
authors = ["fyn"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "threedevil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
zip = "2"
dirs = "6"
rumqttc = "0.25.1"
tokio = { version = "1.54.1", features = ["net", "time", "sync", "macros", "fs", "io-util"] }
x509-parser = "0.18.1"
if-addrs = "0.15.0"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2"] }
futures-util = "0.3"
tauri-plugin-drag = "2.1.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Mesh simplification is a tight loop; keep it fast in `tauri dev` too.
[profile.dev.package.threedevil]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
